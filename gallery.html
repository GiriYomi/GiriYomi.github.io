<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DIRLab Gallery - Photos from conferences, lab activities, and memorable moments.">
  <title>Gallery | DIRLab</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <style>
    .gallery-card--expanded {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: var(--space-6);
      align-items: start;
    }
    @media (max-width: 640px) {
      .gallery-card--expanded {
        grid-template-columns: 1fr;
      }
    }
    .gallery-card__desc {
      color: var(--color-text-muted);
      font-size: var(--text-sm);
      margin: var(--space-2) 0;
    }
    .gallery-card__papers {
      margin: var(--space-4) 0 0 0;
      padding-left: var(--space-5);
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      line-height: 1.6;
    }
    .gallery-card__papers li {
      margin-bottom: var(--space-2);
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <header class="navbar" id="navbar"></header>

  <!-- Page Header -->
  <section class="page-header">
    <div class="container">
      <h1 class="page-header__title">Gallery</h1>
      <p class="page-header__subtitle">
        Memories from conferences, lab activities, and celebrations
      </p>
    </div>
  </section>

  <!-- Main Content -->
  <main class="section">
    <div class="container">
      <!-- Conferences Section -->
      <section style="margin-bottom: var(--space-16);">
        <h2 style="margin-bottom: var(--space-8);">Conferences</h2>
        <div class="gallery-grid" id="conferences-grid"></div>
      </section>

      <!-- Activities Section -->
      <section>
        <h2 style="margin-bottom: var(--space-8);">Lab Activities</h2>
        <div class="gallery-grid" id="activities-grid"></div>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer" id="footer"></footer>

  <!-- Scripts -->
  <script src="data/gallery.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    // Initialize common components
    initCommon('gallery');

    // Render gallery card with full details
    function renderGalleryCard(album) {
      const coverHtml = album.cover 
        ? `<img src="assets/img/gallery/${album.id}/${album.cover}" alt="${album.title}">`
        : `<span>📸</span>`;
      
      const hasPhotos = album.photos && album.photos.length > 0;
      const photoCount = hasPhotos ? `${album.photos.length} photos` : 'Photos coming soon';
      
      // Build papers list if available
      const papersHtml = album.papers && album.papers.length > 0 
        ? `<ul class="gallery-card__papers">
            ${album.papers.map(paper => `<li>${paper}</li>`).join('')}
          </ul>`
        : '';
      
      return `
        <div class="gallery-card gallery-card--expanded">
          <div class="gallery-card__image">
            ${coverHtml}
          </div>
          <div class="gallery-card__body">
            <h4 class="gallery-card__title">${album.title}</h4>
            <p class="gallery-card__meta">
              ${album.date || album.year}
              ${album.location ? ` · ${album.location}` : ''}
              <br><span class="text-muted">${photoCount}</span>
            </p>
            ${album.description ? `<p class="gallery-card__desc">${album.description}</p>` : ''}
            ${papersHtml}
          </div>
        </div>
      `;
    }

    // Render galleries
    function renderGalleryGrid(containerId, albums) {
      const container = document.getElementById(containerId);
      
      if (albums.length === 0) {
        container.innerHTML = `
          <div class="placeholder" style="grid-column: 1 / -1;">
            <div class="placeholder__icon">📸</div>
            <p class="placeholder__text">Albums coming soon</p>
          </div>
        `;
        return;
      }
      
      container.innerHTML = albums.map(renderGalleryCard).join('');
    }

    // Initialize
    renderGalleryGrid('conferences-grid', GALLERY.conferences);
    renderGalleryGrid('activities-grid', GALLERY.activities);
  </script>
</body>
</html>
