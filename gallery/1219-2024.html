<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DIRLab Activity - December 19, 2024">
  <title>Lab Activity 12/19/2024 | DIRLab Gallery</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <style>
    .album-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--space-4);
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--color-text-muted);
      font-size: var(--text-sm);
      margin-bottom: var(--space-4);
      transition: color var(--transition-fast);
    }
    .back-link:hover {
      color: var(--color-primary);
    }
  </style>
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <section class="page-header">
    <div class="container">
      <a href="index.html" class="back-link">← Back to Gallery</a>
      <h1 class="page-header__title">Lab Activity</h1>
      <p class="page-header__subtitle">December 19, 2024</p>
    </div>
  </section>

  <main class="section">
    <div class="container">
      <div class="album-grid">
        <div class="placeholder" style="grid-column: 1 / -1;">
          <div class="placeholder__icon">📸</div>
          <p class="placeholder__text">Photos coming soon</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="../assets/js/main.js"></script>
  <script>initCommon('gallery');</script>
</body>
</html>
