<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DIRLab at SC 2024 - Photos from the conference">
  <title>SC 2024 | DIRLab Gallery</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <style>
    .album-header {
      margin-bottom: var(--space-8);
    }
    .album-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--space-4);
    }
    .album-photo {
      aspect-ratio: 4 / 3;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--color-border-light);
      cursor: pointer;
      transition: transform var(--transition-fast);
    }
    .album-photo:hover {
      transform: scale(1.02);
    }
    .album-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .album-photo--placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-muted);
      font-size: var(--text-4xl);
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--color-text-muted);
      font-size: var(--text-sm);
      margin-bottom: var(--space-4);
      transition: color var(--transition-fast);
    }
    .back-link:hover {
      color: var(--color-primary);
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <header class="navbar" id="navbar"></header>

  <!-- Page Header -->
  <section class="page-header">
    <div class="container">
      <a href="index.html" class="back-link">← Back to Gallery</a>
      <h1 class="page-header__title">SC 2024</h1>
      <p class="page-header__subtitle">Conference photos</p>
    </div>
  </section>

  <!-- Main Content -->
  <main class="section">
    <div class="container">
      <div class="album-grid" id="album-grid">
        <!-- Photos will be rendered here -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer" id="footer"></footer>

  <!-- Scripts -->
  <script src="../data/gallery.js"></script>
  <script src="../assets/js/main.js"></script>
  <script>
    // Initialize common components
    initCommon('gallery');

    // Get album data
    const albumId = 'sc24';
    const album = GALLERY.conferences.find(a => a.id === albumId) || 
                  GALLERY.activities.find(a => a.id === albumId);

    // Render album
    function renderAlbum() {
      const container = document.getElementById('album-grid');
      
      if (!album || !album.photos || album.photos.length === 0) {
        container.innerHTML = `
          <div class="placeholder" style="grid-column: 1 / -1;">
            <div class="placeholder__icon">📸</div>
            <p class="placeholder__text">Photos coming soon</p>
            <p class="text-muted text-sm" style="margin-top: var(--space-2);">
              Check back later for photos from this event.
            </p>
          </div>
        `;
        return;
      }
      
      container.innerHTML = album.photos.map((photo, index) => `
        <div class="album-photo" data-index="${index}">
          <img src="../assets/img/gallery/${albumId}/${photo.src}" alt="${photo.caption || ''}" loading="lazy">
        </div>
      `).join('');
    }

    // Initialize
    renderAlbum();
  </script>
</body>
</html>
