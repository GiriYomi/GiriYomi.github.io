<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DIRLab at SC 2023 - Photos from the conference in Denver">
  <title>SC 2023 | DIRLab Gallery</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <style>
    .album-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--space-4);
    }
    .album-photo {
      aspect-ratio: 4 / 3;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--color-border-light);
    }
    .album-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--color-text-muted);
      font-size: var(--text-sm);
      margin-bottom: var(--space-4);
      transition: color var(--transition-fast);
    }
    .back-link:hover {
      color: var(--color-primary);
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <header class="navbar" id="navbar"></header>

  <!-- Page Header -->
  <section class="page-header">
    <div class="container">
      <a href="index.html" class="back-link">← Back to Gallery</a>
      <h1 class="page-header__title">SC 2023</h1>
      <p class="page-header__subtitle">Denver, CO</p>
    </div>
  </section>

  <!-- Main Content -->
  <main class="section">
    <div class="container">
      <div class="album-grid" id="album-grid">
        <div class="placeholder" style="grid-column: 1 / -1;">
          <div class="placeholder__icon">📸</div>
          <p class="placeholder__text">Photos coming soon</p>
          <p class="text-muted text-sm" style="margin-top: var(--space-2);">
            Check back later for photos from this event.
          </p>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer" id="footer"></footer>

  <!-- Scripts -->
  <script src="../assets/js/main.js"></script>
  <script>
    initCommon('gallery');
  </script>
</body>
</html>
