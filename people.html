<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DIRLab Team - Meet the faculty and students of the Data Intelligence Research Lab at University of Delaware.">
  <title>People | DIRLab</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
</head>
<body>
  <!-- Navbar -->
  <header class="navbar" id="navbar"></header>

  <!-- Page Header -->
  <section class="page-header">
    <div class="container">
      <h1 class="page-header__title">Our Team</h1>
      <p class="page-header__subtitle">
        Meet the researchers driving innovation in data-intensive computing
      </p>
    </div>
  </section>

  <!-- Main Content -->
  <main class="section">
    <div class="container">
      <!-- PI Section -->
      <div id="pi-section"></div>

      <!-- PhD Students -->
      <section style="margin-top: var(--space-16);">
        <h2 style="margin-bottom: var(--space-8);">Ph.D. Students</h2>
        <div class="people-grid" id="phd-grid"></div>
      </section>

      <!-- Master Students -->
      <section style="margin-top: var(--space-16);">
        <h2 style="margin-bottom: var(--space-8);">Master Students</h2>
        <div id="master-section"></div>
      </section>

      <!-- Undergraduate Students -->
      <section style="margin-top: var(--space-16);">
        <h2 style="margin-bottom: var(--space-8);">Undergraduate Students</h2>
        <div id="undergrad-section"></div>
      </section>

      <!-- Alumni -->
      <section style="margin-top: var(--space-16);">
        <h2 style="margin-bottom: var(--space-8);">Alumni</h2>
        <div class="people-grid" id="alumni-grid"></div>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer" id="footer"></footer>

  <!-- Scripts -->
  <script src="data/people.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    // Initialize common components
    initCommon('people');

    // Render PI section
    function renderPI() {
      const container = document.getElementById('pi-section');
      const pi = PEOPLE.pi;
      
      const photoHtml = pi.photo 
        ? `<img src="assets/img/people/${pi.photo}" alt="${pi.name}">`
        : `<span class="featured-person__avatar--placeholder">${getInitials(pi.name)}</span>`;
      
      const linksHtml = pi.links ? `
        <div class="featured-person__links">
          ${pi.links.scholar ? `<a href="${pi.links.scholar}" target="_blank" rel="noopener" class="btn btn--sm btn--outline">Google Scholar</a>` : ''}
          ${pi.links.linkedin ? `<a href="${pi.links.linkedin}" target="_blank" rel="noopener" class="btn btn--sm btn--outline">LinkedIn</a>` : ''}
          ${pi.links.twitter ? `<a href="${pi.links.twitter}" target="_blank" rel="noopener" class="btn btn--sm btn--outline">X / Twitter</a>` : ''}
          ${pi.links.website ? `<a href="${pi.links.website}" target="_blank" rel="noopener" class="btn btn--sm btn--outline">Website</a>` : ''}
        </div>
      ` : '';
      
      container.innerHTML = `
        <article class="featured-person">
          <div class="featured-person__avatar">
            ${photoHtml}
          </div>
          <div class="featured-person__info">
            <h2>${pi.name}</h2>
            <p class="featured-person__title">${pi.role} · ${pi.title}</p>
            <p class="featured-person__bio">${pi.bio}</p>
            ${linksHtml}
            <div class="featured-person__contact">
              <span>📧 ${pi.email}</span>
              <span>📍 ${pi.office}</span>
              <span>📞 ${pi.phone}</span>
            </div>
          </div>
        </article>
      `;
    }

    // Render person card
    function renderPersonCard(person) {
      const photoHtml = person.photo 
        ? `<img src="assets/img/people/${person.photo}" alt="${person.name}">`
        : getInitials(person.name);
      
      return `
        <div class="person-card">
          <div class="person-card__avatar">
            ${photoHtml}
          </div>
          <h4 class="person-card__name">${person.name}</h4>
          <p class="person-card__role">${person.role}</p>
        </div>
      `;
    }

    // Render people grid
    function renderPeopleGrid(containerId, people) {
      const container = document.getElementById(containerId);
      
      if (people.length === 0) {
        container.innerHTML = `
          <div class="placeholder" style="padding: var(--space-8);">
            <p class="placeholder__text">TBD</p>
          </div>
        `;
        return;
      }
      
      container.innerHTML = people.map(renderPersonCard).join('');
    }

    // Initialize
    renderPI();
    renderPeopleGrid('phd-grid', PEOPLE.phd);
    
    // Master students - show TBD if empty
    const masterSection = document.getElementById('master-section');
    if (PEOPLE.master.length === 0) {
      masterSection.innerHTML = `
        <div class="placeholder" style="padding: var(--space-8);">
          <p class="placeholder__text">TBD</p>
        </div>
      `;
    } else {
      masterSection.innerHTML = `<div class="people-grid">${PEOPLE.master.map(renderPersonCard).join('')}</div>`;
    }
    
    // Undergraduate students - show TBD if empty
    const undergradSection = document.getElementById('undergrad-section');
    if (PEOPLE.undergraduate.length === 0) {
      undergradSection.innerHTML = `
        <div class="placeholder" style="padding: var(--space-8);">
          <p class="placeholder__text">TBD</p>
        </div>
      `;
    } else {
      undergradSection.innerHTML = `<div class="people-grid">${PEOPLE.undergraduate.map(renderPersonCard).join('')}</div>`;
    }
    
    renderPeopleGrid('alumni-grid', PEOPLE.alumni);
  </script>
</body>
</html>
